command_timeout = 2000

[aws]
format = ""

[directory]
truncate_to_repo = true
truncation_length = 3
style = "fg:bright-green"

[username]
show_always = false
style_root = "bold fg:bright-blue"
style_user = "bold fg:bright-blue"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "fg:bright-yellow"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-yellow"
rebase = "🔁 REBASE"
merge = "🔀 MERGE"
revert = "⏪ REVERT"
cherry_pick = "🍒 CHERRY-PICK"
bisect = "🔎 BISECT"
am = "📨 AM"
am_or_rebase = "📨/🔁 AM/REBASE"

[line_break]
disabled = false

[time]
disabled = true
format = '🕙[ $time ]($style)'
time_format = "%R"

[git_status]
ahead = "[⇡${count}](bright-green) "
behind = "[⇣${count}](bright-red) "
diverged = "[⇡${ahead_count} ⇣${behind_count}](bright-yellow) "
conflicted = "[🤪 ${count}](bright-red) "
untracked = "[🤷 ${count}](bright-cyan) "
stashed = "[🧳 ${count}](bright-blue) "
modified = "[📒 ${count}](yellow) "
staged = "[✔ ${count}](green) "
renamed = "[🏷️ ${count}](bright-magenta) "
deleted = "[🗑 ${count}](red) "

[git_commit]
only_detached = true

[java]
disabled = true

[package]
disabled = true

[cmd_duration]
min_time = 1000
format = "[$duration](bright-black) "

[nodejs]
format = "via [ $version](green) "

[bun]
format = "via [ $version](bright-yellow) "

[rust]
format = "via [ $version](red) "

[python]
format = "via [ $version](yellow) "
